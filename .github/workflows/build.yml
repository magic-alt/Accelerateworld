name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cuda-compile:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.0.2-devel-ubuntu24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build python3
          rm -rf /var/lib/apt/lists/*

      - name: Toolchain
        run: |
          nvcc --version
          cmake --version
          g++ --version
          python3 --version

      - name: Python syntax validation
        run: |
          python3 -m compileall \
            scripts \
            tests \
            experiments/10_pytorch_extension \
            experiments/11_triton \
            experiments/12_llm_kernels \
            experiments/23_triton_gemm \
            experiments/24_nsys_trace

      - name: Baseline v2 offline tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Nsight Systems trace command dry-run
        run: python3 experiments/24_nsys_trace/run_trace.py --dry-run --disable-pytorch-annotations

      - name: Validate JSON configuration
        run: |
          python3 -m json.tool hardware/rtx_capabilities.json >/dev/null
          python3 -m json.tool benchmarks/manifest.json >/dev/null
          python3 -m json.tool benchmarks/gpu-baseline-v2.schema.json >/dev/null
          python3 -m json.tool CMakePresets.json >/dev/null

      - name: Configure
        run: cmake --preset ci

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset ci-build 2>&1 | tee build/ci-build.log

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-build-log
          path: build/ci-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enumerate GPU tests
        run: ctest --test-dir build/ci -N
