name: python-extension-build

on:
  push:
    branches: [main]
    paths:
      - "experiments/10_pytorch_extension/**"
      - "experiments/25_swiglu_mixed_precision/**"
      - "experiments/26_rope/**"
      - "experiments/27_online_softmax/**"
      - "experiments/28_flash_attention/**"
      - "experiments/29_kv_cache/**"
      - "experiments/30_paged_kv_cache/**"
      - "experiments/31_quantize_dequantize/**"
      - "python/**"
      - "hardware/**"
      - ".github/workflows/python-extension-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "experiments/10_pytorch_extension/**"
      - "experiments/25_swiglu_mixed_precision/**"
      - "experiments/26_rope/**"
      - "experiments/27_online_softmax/**"
      - "experiments/28_flash_attention/**"
      - "experiments/29_kv_cache/**"
      - "experiments/30_paged_kv_cache/**"
      - "experiments/31_quantize_dequantize/**"
      - "python/**"
      - "hardware/**"
      - ".github/workflows/python-extension-build.yml"

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.0.2-devel-ubuntu24.04
    timeout-minutes: 130
    env:
      TORCH_CUDA_ARCH_LIST: "7.5;8.6;8.9;12.0"
      MAX_JOBS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-dev python3-pip python3-venv ninja-build g++
          rm -rf /var/lib/apt/lists/*
          python3 -m venv .venv

      - name: Install PyTorch CUDA 13.0 build dependencies
        run: |
          . .venv/bin/activate
          python -m pip install -U pip setuptools wheel
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cu130
          python -m pip install ninja

      - name: Build dispatcher-backed CUDA extension for RTX 20/30/40/50
        run: |
          . .venv/bin/activate
          cd experiments/10_pytorch_extension
          python setup.py build_ext --inplace

      - name: Inspect dispatcher autograd and FakeTensor registrations
        run: |
          . .venv/bin/activate
          cd experiments/10_pytorch_extension
          python - <<'PY'
          import torch
          import torch.nn.functional as F
          import accelerateworld_ops
          from accelerateworld_ops import _silu_mul_backward_formula
          assert torch._C._dispatch_has_kernel_for_dispatch_key("accelerateworld::silu_mul", "CUDA")
          assert torch._C._dispatch_has_kernel_for_dispatch_key("accelerateworld::silu_mul", "Autograd")
          assert torch._C._dispatch_has_kernel_for_dispatch_key("accelerateworld::silu_mul", "Meta")
          torch.manual_seed(2026)
          gate = torch.randn(64, requires_grad=True)
          up = torch.randn(64, requires_grad=True)
          grad_output = torch.randn(64)
          reference = F.silu(gate) * up
          ref_gate, ref_up = torch.autograd.grad(reference, (gate, up), grad_output)
          got_gate, got_up = _silu_mul_backward_formula(gate.detach(), up.detach(), grad_output)
          torch.testing.assert_close(got_gate, ref_gate, rtol=1e-5, atol=1e-6)
          torch.testing.assert_close(got_up, ref_up, rtol=1e-5, atol=1e-6)
          print("dispatcher + autograd registration validation: PASS")
          PY

      - name: Validate storage-free FakeTensor metadata
        run: |
          . .venv/bin/activate
          cd experiments/10_pytorch_extension
          python fake_tensor_test.py

      - name: Build mixed-precision SwiGLU CUDA extension for RTX 20/30/40/50
        run: |
          . .venv/bin/activate
          cd experiments/25_swiglu_mixed_precision
          python setup.py build_ext --inplace

      - name: Inspect SwiGLU extension exports
        run: |
          . .venv/bin/activate
          cd experiments/25_swiglu_mixed_precision
          python - <<'PY'
          import torch
          import accelerateworld_swiglu_cuda
          assert hasattr(accelerateworld_swiglu_cuda, "swiglu")
          assert hasattr(accelerateworld_swiglu_cuda, "swiglu_out")
          print("mixed-precision SwiGLU extension import/export validation: PASS")
          PY

      - name: Validate RoPE FP32 oracle without a GPU
        run: |
          . .venv/bin/activate
          cd experiments/26_rope
          python reference_test.py

      - name: Build RoPE CUDA extension for RTX 20/30/40/50
        run: |
          . .venv/bin/activate
          cd experiments/26_rope
          python setup.py build_ext --inplace

      - name: Inspect RoPE extension exports
        run: |
          . .venv/bin/activate
          cd experiments/26_rope
          python - <<'PY'
          import torch
          import accelerateworld_rope_cuda
          assert hasattr(accelerateworld_rope_cuda, "rope")
          assert hasattr(accelerateworld_rope_cuda, "rope_out")
          print("RoPE extension import/export validation: PASS")
          PY

      - name: Validate online softmax FP32 oracle without a GPU
        run: |
          . .venv/bin/activate
          cd experiments/27_online_softmax
          python reference_test.py

      - name: Build online softmax CUDA extension for RTX 20/30/40/50
        run: |
          . .venv/bin/activate
          cd experiments/27_online_softmax
          python setup.py build_ext --inplace

      - name: Inspect online softmax extension exports
        run: |
          . .venv/bin/activate
          cd experiments/27_online_softmax
          python - <<'PY'
          import torch
          import accelerateworld_online_softmax_cuda
          for name in ("softmax_two_pass", "softmax_two_pass_out", "softmax_online", "softmax_online_out"):
              assert hasattr(accelerateworld_online_softmax_cuda, name), name
          print("online softmax extension import/export validation: PASS")
          PY

      - name: Validate FlashAttention FP32 oracle without a GPU
        run: |
          . .venv/bin/activate
          cd experiments/28_flash_attention
          python reference_test.py

      - name: Build FlashAttention CUDA extension for RTX 20/30/40/50
        run: |
          . .venv/bin/activate
          cd experiments/28_flash_attention
          python setup.py build_ext --inplace

      - name: Inspect FlashAttention extension exports
        run: |
          . .venv/bin/activate
          cd experiments/28_flash_attention
          python - <<'PY'
          import torch
          import accelerateworld_flash_attention_cuda
          assert hasattr(accelerateworld_flash_attention_cuda, "flash_attention")
          assert hasattr(accelerateworld_flash_attention_cuda, "flash_attention_out")
          print("FlashAttention extension import/export validation: PASS")
          PY

      - name: Validate KV-cache CPU reference without a GPU
        run: |
          . .venv/bin/activate
          cd experiments/29_kv_cache
          python reference_test.py

      - name: Build KV-cache CUDA extension for RTX 20/30/40/50
        run: |
          . .venv/bin/activate
          cd experiments/29_kv_cache
          python setup.py build_ext --inplace

      - name: Inspect KV-cache extension exports
        run: |
          . .venv/bin/activate
          cd experiments/29_kv_cache
          python - <<'PY'
          import torch
          import accelerateworld_kv_cache_cuda
          for name in ("update", "read", "read_out"):
              assert hasattr(accelerateworld_kv_cache_cuda, name), name
          print("KV-cache extension import/export validation: PASS")
          PY

      - name: Validate paged KV-cache CPU reference without a GPU
        run: |
          . .venv/bin/activate
          cd experiments/30_paged_kv_cache
          python reference_test.py

      - name: Build paged KV-cache CUDA extension for RTX 20/30/40/50
        run: |
          . .venv/bin/activate
          cd experiments/30_paged_kv_cache
          python setup.py build_ext --inplace

      - name: Inspect paged KV-cache extension exports
        run: |
          . .venv/bin/activate
          cd experiments/30_paged_kv_cache
          python - <<'PY'
          import torch
          import accelerateworld_paged_kv_cache_cuda
          for name in ("update", "read", "read_out"):
              assert hasattr(accelerateworld_paged_kv_cache_cuda, name), name
          print("paged KV-cache extension import/export validation: PASS")
          PY

      - name: Validate quantize/dequantize CPU reference without a GPU
        run: |
          . .venv/bin/activate
          cd experiments/31_quantize_dequantize
          python reference_test.py

      - name: Build quantize/dequantize CUDA extension for RTX 20/30/40/50
        run: |
          . .venv/bin/activate
          cd experiments/31_quantize_dequantize
          python setup.py build_ext --inplace

      - name: Inspect quantize/dequantize extension exports
        run: |
          . .venv/bin/activate
          cd experiments/31_quantize_dequantize
          python - <<'PY'
          import torch
          import accelerateworld_quant_cuda
          for name in ("quantize_int8", "dequantize_int8", "quantize_int4", "dequantize_int4"):
              assert hasattr(accelerateworld_quant_cuda, name), name
          print("quantize/dequantize extension import/export validation: PASS")
          print("compiled RTX architectures: 7.5, 8.6, 8.9, 12.0")
          PY
