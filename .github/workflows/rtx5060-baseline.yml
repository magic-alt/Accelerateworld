name: rtx5060-baseline

on:
  workflow_dispatch:
    inputs:
      with_ai:
        description: "Also run PyTorch/Triton/LLM-kernel validation"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  baseline:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        if: ${{ inputs.with_ai }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-gpu.txt

      - name: Install AI/GPU dependencies
        if: ${{ inputs.with_ai }}
        run: python -m pip install -r python/requirements-gpu.txt

      - name: Run RTX 5060 native baseline
        if: ${{ !inputs.with_ai }}
        run: bash scripts/run_rtx5060_baseline.sh

      - name: Run RTX 5060 native + AI baseline
        if: ${{ inputs.with_ai }}
        run: bash scripts/run_rtx5060_baseline.sh --with-ai

      - name: Upload immutable baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtx5060-baseline-${{ github.sha }}-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 90
