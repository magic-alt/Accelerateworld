name: weight-only-gemm-gpu-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-gpu.txt

      - name: Install Python GPU dependencies
        run: python -m pip install -r python/requirements-gpu.txt

      - name: Run weight-only GEMM validation
        run: bash scripts/run_weight_only_gemm_validation.sh

      - name: Upload weight-only GEMM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weight-only-gemm-${{ github.run_id }}
          path: |
            results/weight-only-gemm-validation.json
          if-no-files-found: warn
          retention-days: 90
