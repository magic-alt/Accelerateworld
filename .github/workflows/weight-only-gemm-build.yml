name: weight-only-gemm-build

on:
  push:
    branches: [main]
    paths:
      - "experiments/32_weight_only_gemm/**"
      - "tests/test_weight_only_gemm_logic.py"
      - ".github/workflows/weight-only-gemm-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "experiments/32_weight_only_gemm/**"
      - "tests/test_weight_only_gemm_logic.py"
      - ".github/workflows/weight-only-gemm-build.yml"

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.0.2-devel-ubuntu24.04
    timeout-minutes: 35
    env:
      TORCH_CUDA_ARCH_LIST: "7.5;8.6;8.9;12.0"
      MAX_JOBS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-dev python3-pip python3-venv ninja-build g++
          rm -rf /var/lib/apt/lists/*
          python3 -m venv .venv

      - name: Install PyTorch CUDA 13 build dependencies
        run: |
          . .venv/bin/activate
          python -m pip install -U pip setuptools wheel
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cu130
          python -m pip install ninja

      - name: Validate Python syntax
        run: |
          . .venv/bin/activate
          python -m compileall experiments/32_weight_only_gemm tests/test_weight_only_gemm_logic.py

      - name: Validate weight-only GEMM CPU reference
        run: |
          . .venv/bin/activate
          cd experiments/32_weight_only_gemm
          python reference_test.py

      - name: Build weight-only GEMM CUDA extension for RTX 20/30/40/50
        run: |
          . .venv/bin/activate
          cd experiments/32_weight_only_gemm
          python setup.py build_ext --inplace

      - name: Inspect weight-only GEMM extension exports
        run: |
          . .venv/bin/activate
          cd experiments/32_weight_only_gemm
          python - <<'PY'
          import torch
          import accelerateworld_weight_only_gemm_cuda
          assert hasattr(accelerateworld_weight_only_gemm_cuda, "weight_only_gemm")
          print("weight-only GEMM extension import/export validation: PASS")
          print("compiled RTX architectures: 7.5, 8.6, 8.9, 12.0")
          PY
